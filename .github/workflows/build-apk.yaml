name: Build APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Gerar estrutura Android
        run: |
          flutter create --platforms=android \
            --project-name acervoitaboraiense \
            --org br.shop.memoriaitaboraiense \
            /tmp/scaffold
          cp -r /tmp/scaffold/android .

      - name: Aplicar overrides do Android
        run: |
          cp android_overrides/settings.gradle android/settings.gradle
          cp android_overrides/app_build.gradle android/app/build.gradle
          cp android_overrides/gradle-wrapper.properties android/gradle/wrapper/gradle-wrapper.properties
          cp android_overrides/proguard-rules.pro android/app/proguard-rules.pro

      - name: Preparar AndroidManifest
        run: python3 scripts/prepare_android.py

      - name: Instalar dependências
        run: flutter pub get

      - name: Gerar ícones
        run: dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Renomear APK
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/acervo-itaborai-${{ github.ref_name }}.apk

      - name: Salvar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: acervo-itaborai-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Criar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
